name: Compilar SupplyCratesPlugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SupplyCratesPlugin
        uses: actions/checkout@v4
        with:
          path: SupplyCratesPlugin

      - name: Checkout MateSystemPlugin (dependencia)
        uses: actions/checkout@v4
        with:
          repository: ftrotta25-create/MateSystemPlugin
          path: MateSystemPlugin

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Instalar MateSystemPlugin en el repo local (~/.m2)
        run: mvn -B -f MateSystemPlugin/pom.xml clean install -DskipTests

      - name: Compilar SupplyCratesPlugin
        id: build
        run: |
          set +e
          mvn -B -f SupplyCratesPlugin/pom.xml clean package > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Mostrar errores si fallo
        if: steps.build.outputs.exit_code != '0'
        run: |
          grep -n -i -A2 "ERROR\]" build.log | head -100 | sed 's/^/::error::/'
          exit 1

      - name: Subir el .jar como artifact descargable
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: SupplyCratesPlugin-jar
          path: SupplyCratesPlugin/target/SupplyCratesPlugin.jar
